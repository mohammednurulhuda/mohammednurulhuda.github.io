backend:
  name: git-gateway
  branch: main

site_url: https://mohammednurulhuda.netlify.app
display_url: https://mohammednurulhuda.github.io

media_folder: "images" # Folder where uploaded images go
public_folder: "images" # How the website finds those images

collections:
  - name: "content"
    label: "Website Content"
    files:
      - label: "My Articles"
        name: "articles"
        file: "data.json"
        fields:
          # You must have array items starting with "-" here:
          - {label: "Article Title", name: "title", widget: "string"}
          - {label: "Content", name: "body", widget: "markdown"}
          
      - label: "My Projects"
        name: "projects"
        file: "projects.json"
        fields:
          - label: "Project List"
            name: "items"
            widget: "list"
            # ... (rest of your projects config)
            fields:
              - {label: "Project Title", name: "title", widget: "string"}
              - {label: "Cover Image", name: "media", widget: "image", required: false}
              - {label: "Project Details", name: "text", widget: "markdown"}